name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: ['*']

jobs:
  test:
    name: Run tests
    runs-on: macOS-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test
        run: xcodebuild test -scheme ShowTime -sdk iphonesimulator -destination "platform=iOS Simulator,name=iPhone 17 Pro"
